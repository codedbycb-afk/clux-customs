<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C-Lux Shop</title>
<meta name="theme-color" content="#0a0a0b">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="C-Lux Shop">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="../demo/demo.css">
</head>
<body class="app-preview">
<div id="login" class="login" hidden>
  <div class="login-card">
    <div class="brand"><span class="mark">C<i>/</i>LUX</span><span class="brand-sub">Shop</span></div>
    <p class="muted">Enter your passcode.</p>
    <form id="loginForm">
      <input id="code" class="input code" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••" aria-label="Passcode">
      <button class="btn red block" type="submit">Unlock</button>
      <p class="err" id="loginErr"></p>
    </form>
  </div>
</div>

<div id="shell" class="shell" hidden>
  <header class="top">
    <div class="brand sm"><span class="mark">C<i>/</i>LUX</span><span class="brand-sub">Shop</span></div>
    <button class="btn red sm" id="newBtn">+ Booking</button>
  </header>
  <main id="view" class="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>Today</button>
    <button data-tab="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
    <button data-tab="bookings"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Bookings</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  </nav>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-bg" data-close></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="../demo/demo.js" type="module"></script>
<script src="app.js" type="module"></script>
</body>
</html>
